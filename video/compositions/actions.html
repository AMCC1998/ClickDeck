  <script>
    const tl = gsap.timeline({ paused: true });
    const cuts = [0, 0.85, 1.6, 2.35];
    const shotEnd = 3.6;

    // Chega de baixo, com a mesma velocidade do whip que saiu.
    tl.fromTo("#act-stage", { y: 1400 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);

    // Cortes secos nas fotos, em cada mudança de palavra.
    ["#act-s1", "#act-s2", "#act-s3", "#act-s4"].forEach((id, i) => {
      tl.set(id, { opacity: 1 }, cuts[i]);
      if (i < 3) tl.set(id, { opacity: 0 }, cuts[i + 1]);
    });
    const end = (i) => (i < 3 ? cuts[i + 1] : shotEnd) - cuts[i];
    tl.fromTo("#act-s1", { x: 0 }, { x: -30, duration: end(0), ease: "none" }, cuts[0]);
    tl.fromTo("#act-s2", { scale: 1.5, x: 0 }, { scale: 1.5, x: 25, duration: end(1), ease: "none" }, cuts[1]);
    tl.fromTo("#act-s3", { scale: 1.1, x: -20 }, { scale: 1.1, x: 10, duration: end(2), ease: "none" }, cuts[2]);
    tl.fromTo("#act-s4", { scale: 1.45, x: 0 }, { scale: 1.45, x: -20, duration: end(3), ease: "none" }, cuts[3]);

    // Palavra em slot machine: um rolo de 0,12 s por corte.
    cuts.slice(1).forEach((t, i) => {
      tl.fromTo(
        "#act-stack",
        { y: -160 * i },
        { y: -160 * (i + 1), duration: 0.12, ease: "power2.out" },
        t,
      );
    });

    // A tecla laranja cresce até ser o mundo da cena seguinte.
    tl.fromTo(
      "#act-flood",
      { scale: 0, borderRadius: 40 },
      { scale: 12, borderRadius: 0, duration: 0.55, ease: "power2.inOut" },
      3.0,
    );

    window.__timelines["actions"] = tl;
  </script>

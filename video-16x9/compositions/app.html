  </style>
  <div id="root" data-composition-id="app" data-width="1920" data-height="1080">
    <h1 id="app-a" class="app-hl" data-layout-allow-overlap>
      <span class="w">A</span> <span class="w">tua</span> <span class="w acc">cor.</span>
    </h1>
    <h1 id="app-b" class="app-hl" data-layout-allow-overlap>
      <span class="w">Perfis</span><br /><span class="w">por</span> <span class="w acc">app.</span>
    </h1>
    <div id="app-chip">
      <span id="app-chip-label">PERFIL</span>
      <span id="app-chip-window">
        <span id="app-chip-stack">
          <span class="app-chip-val">Geral</span>
          <span class="app-chip-val">Fusion 360</span>
        </span>
      </span>

      <span class="app-led"></span><span class="app-led"></span><span class="app-led"></span><span class="app-led"></span
      ><span class="app-led"></span><span class="app-led"></span><span class="app-led"></span><span class="app-led"></span>
    </div>
    <div id="app-flood" data-layout-ignore></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const keyColors = ["#ff7850", "#ffbe46", "#6ed278", "#50b4f0", "#9682fa", "#f06eb4", "#2dd4bf", "#ef4444"];
    const fusionColors = ["#2dd4bf", "#2dd4bf", "#50b4f0", "#50b4f0", "#9682fa", "#9682fa", "#f4f4f2", "#f4f4f2"];
    const leds = gsap.utils.toArray("#app-leds .app-led");

    // O mundo laranja encolhe até ser a tecla 1 da app.
    tl.fromTo(
      "#app-flood",
      { clipPath: "inset(0px 0px 0px 0px round 0px)" },
      { clipPath: "inset(270px 803px 603px 910px round 20px)", duration: 0.5, ease: "power3.inOut" },
      0,
    );
    tl.fromTo("#app-flood", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.out" }, 0.5);

    tl.fromTo(
      "#app-a .w",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.067 },
      0.45,
    );
    tl.fromTo("#app-chip", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.6);

    // A barra de LEDs acende com a cor de cada tecla.
    tl.fromTo("#app-leds", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.6);
    leds.forEach((led, i) => {
      tl.fromTo(
        led,
        { backgroundColor: "#2a2d35", boxShadow: "0 0 0px 0px rgba(0,0,0,0)" },
        { backgroundColor: keyColors[i], boxShadow: `0 0 26px 6px ${keyColors[i]}88`, duration: 0.15, ease: "power2.out" },
        0.75 + i * 0.06,
      );
    });

    // Muda o perfil: frase, chip e LEDs trocam juntos.
    tl.to(
      "#app-a .w",
      { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", stagger: 0.03 },
      1.8,
    );
    tl.fromTo("#app-chip-stack", { y: 0 }, { y: -44, duration: 0.12, ease: "power2.out" }, 1.95);
    tl.fromTo(
      "#app-b .w",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.067 },
      1.95,
    );
    leds.forEach((led, i) => {
      tl.to(
        led,
        { backgroundColor: fusionColors[i], boxShadow: `0 0 26px 6px ${fusionColors[i]}88`, duration: 0.15, ease: "power2.out" },
        2.0 + i * 0.04,
      );
    });

    // Zoom através do ecrã da app.
    tl.fromTo(
      ["#app-a", "#app-b", "#app-chip", "#app-leds"],
      { opacity: 1 },
      { opacity: 0, duration: 0.15, ease: "power2.in" },
      3.3,
    );
    tl.fromTo("#app-card", { scale: 1 }, { scale: 2.8, duration: 0.5, ease: "power3.in" }, 3.3);

    window.__timelines["app"] = tl;
  </script>
</template>
